[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veritell-cli"
version = "0.1.0"
description = "Veritell command-line tooling scaffold."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Veritell" }]
dependencies = [
  "jsonschema>=4.23,<5",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0,<7",
  "tomli>=2.0,<3; python_version < '3.11'",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "pytest>=9.0.0",
]

[project.scripts]
veritell = "veritell.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
veritell = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
